<!doctype html>
<html>
<head>
    <title>Sammartino Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>
    <img src="y8-logo.png" alt="SAMMARTINO GAMES" width="500" height="100">
</h1>

<div id="games"></div>

<script>
const repoOwner = "JXFC";
const repoName = "sammartinogames";
const gamesFolder = "GameFiles";

const gamesContainer = document.getElementById("games");

async function loadGames() {
    try {
        const response = await fetch(
            `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${gamesFolder}`
        );

        const folders = await response.json();

        if (!Array.isArray(folders)) {
            gamesContainer.innerHTML = "<p>Couldn't load games.</p>";
            return;
        }

        for (const folder of folders) {
            if (folder.type !== "dir") continue;

            const gameName = formatName(folder.name);
            const gamePath = `${gamesFolder}/${folder.name}/index.html`;

            const thumbnail = await findThumbnail(folder.name);

            const button = document.createElement("button");

            button.onclick = () => {
                window.open(gamePath, "_blank");
            };

            button.innerHTML = `
                ${gameName}<br>
                <img src="${thumbnail}" alt="${gameName}" width="60" height="60">
            `;

            gamesContainer.appendChild(button);
        }

    } catch (error) {
        console.error(error);
        gamesContainer.innerHTML = "<p>Couldn't load games.</p>";
    }
}

function formatName(name) {
    return name
        .replace(/([a-z])([A-Z])/g, "$1 $2")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

async function findThumbnail(folder) {
    const image = "imagesam.png";
    const url = `${gamesFolder}/${folder}/${image}`;

    try {
        const response = await fetch(url, { method: "HEAD" });

        if (response.ok) {
            return url;
        }
    } catch (error) {
        // Image doesn't exist
    }

    return "y8-logo.png";
}

loadGames();
</script>

</body>
</html>

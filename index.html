<!doctype html>
<html>
<head>
    <title>Sammartino Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>
    <img src="y8-logo.png" alt="SAMMARTINO GAMES" width="500" height="100">
</h1>

<div id="games"></div>

<script>
const games = [
    ["baldisbasics", "Baldi's Basics"],
    ["bitlife", "Bitlife"],
    ["chromedino", "Chrome Dino"],
    ["crossyroad", "Crossy Road"],
    ["deathrun3d", "Death Run 3D"],
    ["drifthunters", "Drift Hunters"],
    ["drivemad", "Drive Mad"],
    ["grometrydash", "Geometry Dash"],
    ["tinyfishing", "Tiny Fishing"],
    ["tombofthemask", "Tomb of the Mask"],
    ["towermaster", "Tower Master"],
    ["vex3", "Vex 3"],
    ["tetris", "Tetris"],
    ["stack", "Stack"],
    ["stackball", "Stack Ball!"],
    ["soccerrandom", "Soccer Random"],
    ["ovo2", "OvO 2"],
    ["motoroadrash3d", "Moto Roadrash"],
    ["monkeymart", "Monkeymart"],
    ["googlesnake", "Snake"],
    ["fruitninja", "Fruit Ninjago"],
];

const gamesContainer = document.getElementById("games");

async function findThumbnail(folder) {
    const path = `GameFiles/${folder}/imagesam.png`;

    try {
        const response = await fetch(path, {
            method: "HEAD"
        });

        if (response.ok) {
            return path;
        }
    } catch (error) {
        // No imagesam.png
    }

    return "y8-logo.png";
}

async function loadGames() {
    for (const [folder, name] of games) {

        const button = document.createElement("button");

        button.onclick = () => {
            window.open(
                `GameFiles/${folder}/index.html`,
                "_blank"
            );
        };

        const thumbnail = await findThumbnail(folder);

        button.innerHTML = `
            ${name}<br>
            <img
                src="${thumbnail}"
                alt="${name}"
                width="60"
                height="60"
            >
        `;

        gamesContainer.appendChild(button);
    }
}

loadGames();
</script>

</body>
</html>
